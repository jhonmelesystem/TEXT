<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>text - prueba de chat</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Arial, sans-serif; background: #f2f2f2; color: #111; }
  #login { padding: 10px; background: #111; color: #fff; display: flex; gap: 8px; align-items: center; }
  #login input { flex: 1; padding: 8px; border: 1px solid #888; background: #fff; }
  #who { font-size: 13px; color: #9ec1ff; white-space: nowrap; }
  button { background: #1a73e8; color: #fff; border: 0; padding: 9px 14px; cursor: pointer; }
  #app { display: flex; height: calc(100vh - 54px); }
  #side { width: 280px; background: #fff; border-right: 1px solid #ccc; overflow: auto; }
  .contact { padding: 12px; border-bottom: 1px solid #eee; cursor: pointer; }
  .contact.active { background: #e8f0fe; }
  .badge { background: #1a73e8; color: #fff; border-radius: 10px; padding: 1px 7px; font-size: 12px; float: right; }
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #head { padding: 12px; background: #fff; border-bottom: 1px solid #ccc; font-weight: bold; }
  #msgs { flex: 1; overflow: auto; padding: 12px; background: #dcdcdc; display: flex; flex-direction: column; }
  .m { max-width: 70%; margin: 3px 0; padding: 7px 10px; background: #fff; word-wrap: break-word; align-self: flex-start; }
  .m.me { background: #bcd7ff; align-self: flex-end; }
  .t { font-size: 11px; color: #666; text-align: right; margin-top: 2px; }
  .read { color: #1a73e8; font-weight: bold; }
  #typing { height: 20px; font-size: 12px; color: #555; padding: 2px 12px; background: #ececec; }
  #bar { display: flex; gap: 8px; padding: 8px; background: #fff; border-top: 1px solid #ccc; }
  #bar input[type=text], #bar #text { flex: 1; padding: 10px; border: 1px solid #888; }
  #attach { background: #555; }
  .pic { display: block; max-width: 240px; max-height: 300px; cursor: pointer; margin-bottom: 4px; }
  #tools { padding: 6px 12px; background: #fff; border-bottom: 1px solid #ccc; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 13px; }
  #tools button { padding: 5px 10px; font-size: 12px; background: #555; }
  #tools input[type=color] { width: 34px; height: 28px; padding: 0; border: 1px solid #888; }
  .sw { display: inline-block; width: 22px; height: 22px; border: 1px solid #777; cursor: pointer; }
  body.dark { background: #0d0d0d; color: #eee; }
  body.dark #side, body.dark #head, body.dark #bar, body.dark #tools { background: #1a1a1a; border-color: #333; color: #eee; }
  body.dark .contact { border-color: #2a2a2a; }
  body.dark .contact.active { background: #12305f; }
  body.dark .m { background: #2a2a2a; color: #eee; }
  body.dark .m.me { background: #1a4a8f; }
  body.dark .t { color: #aaa; }
  body.dark #bar #text { background: #222; color: #eee; border-color: #555; }
  body.dark #typing { background: #1a1a1a; color: #aaa; }
</style>
</head>
<body>
<div id="login">
  <input id="token" placeholder="Pega aqui tu token (sin comillas)">
  <button id="connect">Conectar</button>
  <span id="who"></span>
</div>
<div id="app">
  <div id="side"></div>
  <div id="main">
    <div id="head">Elige un contacto</div>
    <div id="tools">
      Fondo:
      <input type="color" id="bgcolor" value="#ffffff" title="Elegir color">
      <span id="swatches"></span>
      <button id="bgimg">Imagen</button>
      <input type="file" id="bgfile" accept="image/*" hidden>
      <button id="bgreset">Quitar</button>
      <button id="theme">Tema oscuro</button>
    </div>
    <div id="msgs"></div>
    <div id="typing"></div>
    <div id="bar">
      <button id="attach" title="Enviar imagen o video">&#128206;</button>
      <input type="file" id="file" accept="image/*,video/*" hidden>
      <input id="text" placeholder="Escribe un mensaje" autocomplete="off">
      <button id="send">Enviar</button>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const $ = (id) => document.getElementById(id);
let token = sessionStorage.getItem('token') || '';
let me = null, socket = null, current = null, contacts = [], unread = {};
$('token').value = token;

async function api(path) {
  const r = await fetch(path, { headers: { Authorization: 'Bearer ' + token } });
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || r.status);
  return data;
}

$('connect').onclick = async () => {
  token = $('token').value.trim().replace(/^"|"$/g, '').replace(/^Bearer\s+/i, '');
  try {
    me = await api('/api/me');
    sessionStorage.setItem('token', token);
    $('who').textContent = me.display_name + ' (@' + me.username + ')';
    contacts = await api('/api/contacts');
    const chats = await api('/api/chats');
    unread = {};
    chats.forEach((c) => { unread[c.chat_id] = Number(c.unread); });
    renderContacts();
    connectSocket();
    applyBg(await api('/api/settings'));
  } catch (e) { alert('Error: ' + e.message); }
};

function renderContacts() {
  const box = $('side');
  box.innerHTML = '';
  contacts.forEach((c) => {
    const d = document.createElement('div');
    d.className = 'contact' + (current && current.chat_id === c.chat_id ? ' active' : '');
    d.textContent = c.display_name + ' (@' + c.username + ')';
    if (unread[c.chat_id]) {
      const b = document.createElement('span');
      b.className = 'badge';
      b.textContent = unread[c.chat_id];
      d.prepend(b);
    }
    d.onclick = () => openChat(c);
    box.appendChild(d);
  });
}

async function openChat(c) {
  current = c;
  unread[c.chat_id] = 0;
  renderContacts();
  $('head').textContent = c.display_name;
  $('msgs').innerHTML = '';
  $('typing').textContent = '';
  const list = await api('/api/chats/' + c.chat_id + '/messages');
  list.forEach(addMsg);
  socket.emit('message:read', { chat_id: c.chat_id });
}

function setTick(id, status) {
  const el = $('s' + id);
  if (!el) return;
  el.textContent = status === 'sent' ? '✓' : '✓✓';
  el.className = status === 'read' ? 'read' : '';
}

function addMsg(m) {
  if ($('m' + m.id)) return;
  const mine = m.sender_id === me.id;
  const d = document.createElement('div');
  d.id = 'm' + m.id;
  d.className = 'm' + (mine ? ' me' : '');
  if (m.type === 'image' && m.media_url) {
    const img = document.createElement('img');
    img.className = 'pic';
    img.src = m.media_url;
    img.onload = () => { $('msgs').scrollTop = $('msgs').scrollHeight; };
    img.onclick = () => window.open(m.media_url, '_blank');
    d.appendChild(img);
  }
  if (m.type === 'video' && m.media_url) {
    const v = document.createElement('video');
    v.className = 'pic';
    v.controls = true;
    v.preload = 'metadata';
    v.poster = m.media_url.replace(/\.mp4$/, '.jpg');
    v.src = m.media_url;
    d.appendChild(v);
  }
  if (m.body) {
    const body = document.createElement('div');
    body.textContent = m.body;
    d.appendChild(body);
  }
  const t = document.createElement('div');
  t.className = 't';
  t.textContent = new Date(m.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + ' ';
  if (mine) {
    const s = document.createElement('span');
    s.id = 's' + m.id;
    t.appendChild(s);
  }
  d.appendChild(t);
  $('msgs').appendChild(d);
  if (mine) setTick(m.id, m.status);
  $('msgs').scrollTop = $('msgs').scrollHeight;
}

function connectSocket() {
  if (socket) socket.disconnect();
  socket = io({ auth: { token } });
  socket.on('connect_error', (e) => alert('Socket: ' + e.message));
  socket.on('message:new', (m) => {
    if (current && current.chat_id === m.chat_id) {
      addMsg(m);
      if (m.sender_id !== me.id) socket.emit('message:read', { chat_id: m.chat_id });
    } else if (m.sender_id !== me.id) {
      unread[m.chat_id] = (unread[m.chat_id] || 0) + 1;
      renderContacts();
    }
  });
  socket.on('message:status', (s) => s.message_ids.forEach((id) => setTick(id, s.status)));
  socket.on('typing', (t) => {
    if (current && current.chat_id === t.chat_id) {
      $('typing').textContent = t.is_typing ? current.display_name + ' esta escribiendo...' : '';
    }
  });
}

function send() {
  const body = $('text').value.trim();
  if (!body || !current || !socket) return;
  socket.emit('message:send', { chat_id: current.chat_id, body }, (r) => {
    if (!r.ok) return alert(r.error);
    addMsg(r.message);
  });
  $('text').value = '';
}
$('send').onclick = send;

$('attach').onclick = () => $('file').click();
let VIDEO_MAX = 60;
fetch('/api/limits').then((r) => r.json()).then((l) => { if (l.video_max_seconds) VIDEO_MAX = l.video_max_seconds; }).catch(() => {});

// Duracion del video leida en el navegador, antes de subirlo
function videoDuration(file) {
  return new Promise((resolve) => {
    const v = document.createElement('video');
    const url = URL.createObjectURL(file);
    v.preload = 'metadata';
    v.onloadedmetadata = () => { URL.revokeObjectURL(url); resolve(v.duration); };
    v.onerror = () => { URL.revokeObjectURL(url); resolve(null); };
    v.src = url;
  });
}

// Subida con barra de progreso
function uploadFile(url, fd, onProgress) {
  return new Promise((resolve, reject) => {
    const x = new XMLHttpRequest();
    x.open('POST', url);
    x.setRequestHeader('Authorization', 'Bearer ' + token);
    x.upload.onprogress = (e) => { if (e.lengthComputable) onProgress(Math.round((e.loaded / e.total) * 100)); };
    x.onload = () => {
      let data = {};
      try { data = JSON.parse(x.responseText); } catch (e) {}
      resolve({ ok: x.status >= 200 && x.status < 300, data });
    };
    x.onerror = () => reject(new Error('Sin conexion con el servidor'));
    x.send(fd);
  });
}

$('file').onchange = async () => {
  const f = $('file').files[0];
  $('file').value = '';
  if (!f || !current) return;
  const isVideo = f.type.startsWith('video/');
  if (isVideo) {
    const d = await videoDuration(f);
    if (d && d > VIDEO_MAX + 0.5) {
      return alert('El video dura ' + Math.round(d) + ' s y el maximo es ' + VIDEO_MAX + ' s. Recortalo antes de enviarlo.');
    }
  }
  const fd = new FormData();
  const caption = $('text').value.trim();
  if (caption) { fd.append('caption', caption); $('text').value = ''; }
  fd.append('file', f);
  const label = isVideo ? 'video' : 'imagen';
  const url = '/api/chats/' + current.chat_id + (isVideo ? '/video' : '/media');
  $('typing').textContent = 'Subiendo ' + label + '... 0%';
  try {
    const r = await uploadFile(url, fd, (p) => {
      $('typing').textContent = p < 100
        ? 'Subiendo ' + label + '... ' + p + '%'
        : (isVideo ? 'Procesando video en el servidor (puede tardar)...' : 'Procesando imagen...');
    });
    if (!r.ok) return alert(r.data.error || 'Error al enviar');
    addMsg(r.data.message);
  } catch (e) { alert('Error al enviar: ' + e.message); }
  finally { $('typing').textContent = ''; }
};
$('text').onkeydown = (e) => { if (e.key === 'Enter') send(); };

let typingSent = false, typingTimer = null;
$('text').oninput = () => {
  if (!current || !socket) return;
  if (!typingSent) { socket.emit('typing', { chat_id: current.chat_id, is_typing: true }); typingSent = true; }
  clearTimeout(typingTimer);
  typingTimer = setTimeout(() => {
    socket.emit('typing', { chat_id: current.chat_id, is_typing: false });
    typingSent = false;
  }, 1500);
};


// ---------- Personalizacion ----------
const PRESETS = ['#FFFFFF', '#E0E0E0', '#9E9E9E', '#BBD7FF', '#1A73E8', '#111111'];

function applyBg(s) {
  const el = $('msgs');
  if (s.chat_bg_type === 'image') {
    el.style.background = 'url("' + s.chat_bg_value + '") center / cover no-repeat';
  } else {
    el.style.background = s.chat_bg_value;
    $('bgcolor').value = s.chat_bg_value.toLowerCase();
  }
}

async function call(method, path, body, isForm) {
  const headers = { Authorization: 'Bearer ' + token };
  if (body && !isForm) headers['Content-Type'] = 'application/json';
  const r = await fetch(path, { method, headers, body: body ? (isForm ? body : JSON.stringify(body)) : undefined });
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || r.status);
  return d;
}

async function setBgColor(color) {
  try { applyBg(await call('PUT', '/api/settings/background', { type: 'color', value: color })); }
  catch (e) { alert('Error: ' + e.message); }
}

PRESETS.forEach((c) => {
  const sw = document.createElement('span');
  sw.className = 'sw';
  sw.style.background = c;
  sw.onclick = () => setBgColor(c);
  $('swatches').appendChild(sw);
});

$('bgcolor').onchange = () => setBgColor($('bgcolor').value);
$('bgimg').onclick = () => $('bgfile').click();
$('bgfile').onchange = async () => {
  const f = $('bgfile').files[0];
  $('bgfile').value = '';
  if (!f || !me) return;
  const fd = new FormData();
  fd.append('file', f);
  try { applyBg(await call('POST', '/api/settings/background/image', fd, true)); }
  catch (e) { alert('Error: ' + e.message); }
};
$('bgreset').onclick = async () => {
  if (!me) return;
  try { applyBg(await call('DELETE', '/api/settings/background')); }
  catch (e) { alert('Error: ' + e.message); }
};

function applyTheme(dark) {
  document.body.classList.toggle('dark', dark);
  $('theme').textContent = dark ? 'Tema claro' : 'Tema oscuro';
}
$('theme').onclick = () => {
  const dark = !document.body.classList.contains('dark');
  applyTheme(dark);
  localStorage.setItem('theme', dark ? 'dark' : 'light');
};
applyTheme(localStorage.getItem('theme') === 'dark');

if (token) $('connect').click();
</script>
</body>
</html>
